<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMASTER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #000000);
    --hint: var(--tg-theme-hint-color, #708499);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f2);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
  }
  h2 { margin: 0 0 14px; font-size: 20px; }
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .card {
    border: 2px solid transparent; border-radius: 12px;
    padding: 12px; background: var(--card); cursor: pointer;
    transition: border-color .15s;
  }
  .card.active { border-color: var(--accent); }
  .card b { display: block; font-size: 15px; margin-bottom: 4px; }
  .card span { font-size: 13px; color: var(--hint); }
  label { display: block; margin: 16px 0 6px; font-weight: 600; font-size: 14px; }
  input, textarea {
    width: 100%; padding: 11px; font-size: 15px;
    border: 1px solid var(--hint); border-radius: 10px;
    background: var(--bg); color: var(--text);
  }
  textarea { min-height: 110px; resize: vertical; }
  .counter { font-size: 12px; color: var(--hint); text-align: right; margin-top: 4px; }
  button {
    width: 100%; margin-top: 20px; padding: 14px; border: 0;
    border-radius: 10px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--accent-text);
    cursor: pointer;
  }
  button:disabled { opacity: .5; }
</style>
</head>
<body>

<h2>📢 Reklama buyurtma qilish</h2>

<div class="plans" id="plans"></div>

<label for="channel">Kanal yoki manzil</label>
<input id="channel" placeholder="@kanal_nomi" autocomplete="off">

<label for="text">Reklama matni</label>
<textarea id="text" maxlength="1000" placeholder="Reklama matnini yozing..."></textarea>
<div class="counter"><span id="count">0</span>/1000</div>

<button id="submit">Buyurtma berish</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const PLANS = {
    START: "10 000 so'm",
    STANDART: "25 000 so'm",
    PREMIUM: "50 000 so'm",
    VIP: "100 000 so'm",
  };
  let selected = "START";

  const plansEl = document.getElementById("plans");
  for (const [name, price] of Object.entries(PLANS)) {
    const card = document.createElement("div");
    card.className = "card" + (name === selected ? " active" : "");
    card.innerHTML = `<b>${name}</b><span>${price}</span>`;
    card.onclick = () => {
      selected = name;
      document.querySelectorAll(".card").forEach(c => c.classList.remove("active"));
      card.classList.add("active");
    };
    plansEl.appendChild(card);
  }

  const textEl = document.getElementById("text");
  textEl.addEventListener("input", () => {
    document.getElementById("count").textContent = textEl.value.length;
  });

  document.getElementById("submit").onclick = () => {
    const channel = document.getElementById("channel").value.trim();
    const text = textEl.value.trim();

    if (!channel || !text) {
      tg.showAlert("Iltimos, kanal va matnni to'ldiring");
      return;
    }

    // Ma'lumotni botga yuboradi (bot web_app_data handleri qabul qiladi)
    tg.sendData(JSON.stringify({ channel, plan: selected, text }));
  };
</script>
</body>
</html>
